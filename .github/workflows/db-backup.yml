name: Daily DB backup

# Dumps the production database every day and uploads it as an ENCRYPTED
# workflow artifact. The repository is public, so artifacts can be downloaded
# by any signed-in GitHub user: a plaintext dump must never be uploaded.
# Dumps are encrypted with age for BACKUP_AGE_RECIPIENT (public key); only the
# holder of the matching private key can read them.
# Restore procedure: docs/runbooks/restore-from-backup.md
on:
  schedule:
    - cron: "30 3 * * *" # 03:30 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  backup:
    name: pg_dump to encrypted artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Bail out early if secrets are missing
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID BACKUP_AGE_RECIPIENT; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret ${name}."
              missing=1
            fi
          done
          case "${BACKUP_AGE_RECIPIENT}" in
            age1*) ;;
            *) echo "::error::BACKUP_AGE_RECIPIENT must be an age public key (age1…)."; missing=1 ;;
          esac
          exit "${missing}"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.117.0

      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Dump (schema + data) and encrypt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          umask 077
          stamp=$(date -u +%Y-%m-%d)
          plain_dir="$RUNNER_TEMP/plain"
          mkdir -p "$plain_dir" encrypted

          supabase db dump -f "$plain_dir/finify-backup-${stamp}-schema.sql"
          supabase db dump --data-only -f "$plain_dir/finify-backup-${stamp}-data.sql"

          for file in "$plain_dir"/*.sql; do
            age -r "$BACKUP_AGE_RECIPIENT" -o "encrypted/$(basename "$file").age" "$file"
          done
          rm -rf "$plain_dir"
          ls -lh encrypted

      - name: Upload encrypted artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: finify-db-backup-${{ github.run_id }}
          path: encrypted/*.age
          retention-days: 30
          if-no-files-found: error
