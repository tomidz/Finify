name: DB types drift

# Runs on every PR so this required check always reports a status.
# Branch protection treats path-filtered workflows as permanently pending
# on PRs that don't touch the filtered paths, blocking the merge. We do
# the path filter inside the job and short-circuit when irrelevant.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: Regenerate types and diff
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect relevant changes
        id: changes
        run: |
          set -euo pipefail
          # Computed on its own line so a failing git diff fails the job
          # instead of silently reporting "no relevant changes".
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if printf '%s\n' "$changed" \
            | grep -Eq '^(supabase/migrations/|src/types/database\.types\.ts$|scripts/db-types.*\.sh$|\.github/workflows/db-types-check\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No relevant changes — skipping types drift check."
          fi

      - name: Setup Supabase CLI
        if: steps.changes.outputs.relevant == 'true'
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.117.0

      - name: Start Supabase
        if: steps.changes.outputs.relevant == 'true'
        run: supabase start

      - name: Check types drift
        if: steps.changes.outputs.relevant == 'true'
        run: bash scripts/db-types-check.sh

      - name: Stop Supabase
        if: always() && steps.changes.outputs.relevant == 'true'
        run: supabase stop --no-backup
