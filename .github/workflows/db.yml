name: Database

# Applies every migration to a local Supabase, then runs the pgTAP suite,
# plpgsql lint and the generated-types comparison. Runs on every PR and skips
# its steps inside the job when nothing database-related changed.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Migrations, pgTAP, lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect relevant changes
        id: changes
        run: |
          set -euo pipefail
          # Computed on its own line so a failing git diff fails the job
          # instead of silently reporting "no relevant changes".
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if printf '%s\n' "$changed" \
            | grep -Eq '^(supabase/|src/types/database\.types\.ts$|scripts/db-types.*\.sh$|\.github/workflows/db\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No database changes — skipping."
          fi

      - name: The pgTAP suite is not empty
        if: steps.changes.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          count=$(find supabase/tests -name '*_test.sql' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::supabase/tests has no *_test.sql files."
            exit 1
          fi
          echo "$count test files"

      - name: Setup Supabase CLI
        if: steps.changes.outputs.relevant == 'true'
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.117.0

      - name: Start Supabase
        if: steps.changes.outputs.relevant == 'true'
        run: supabase start

      - name: pgTAP
        if: steps.changes.outputs.relevant == 'true'
        run: supabase test db

      - name: plpgsql lint
        # Also after a pgTAP failure, so one run reports every problem.
        if: ${{ !cancelled() && steps.changes.outputs.relevant == 'true' }}
        run: supabase db lint --schema public --level error --fail-on error

      - name: Check types drift
        # Also after a pgTAP failure, so one run reports every problem.
        if: ${{ !cancelled() && steps.changes.outputs.relevant == 'true' }}
        run: bash scripts/db-types-check.sh

      - name: Stop Supabase
        if: always() && steps.changes.outputs.relevant == 'true'
        run: supabase stop --no-backup
